<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="txtwall — one shared pixel canvas. 10 pixels a day, 100 with an account. Nothing expires.">
<title>txtwall</title>
<link rel="stylesheet" href="/css/app.css?v=2">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

<header>
  <div class="brand">
    <h1>txtwall</h1>
    <p id="tagline">one pixel at a time.</p>
  </div>
  <div class="head-right">
    <span class="hud" id="hud">loading...</span>
    <button class="acct-tab" id="acctTab">account</button>
  </div>
</header>

<!-- account panel, opened by the account button -->
<div class="panel" id="panel">
  <div class="row" id="authRow">
    <input id="user" placeholder="username" maxlength="32" autocomplete="username" spellcheck="false">
    <input id="pass" placeholder="password" type="password" maxlength="64" autocomplete="current-password">
    <button class="btn-sm" id="loginBtn">log in</button>
    <button class="btn-sm btn-ghost" id="signupBtn">sign up</button>
  </div>
  <div id="turnstileBox" style="display:none"></div>
  <div class="err" id="errBox" style="display:none"></div>
  <div class="info" id="authInfo" style="display:none"></div>
  <div class="limits" id="limitsHint"></div>
</div>

<!-- toolbar: palette, erase, zoom -->
<div class="toolbar">
  <div class="palette" id="palette"></div>
  <button class="btn-sm btn-ghost" id="eraseBtn" title="erase mode (E) — costs a pixel">erase</button>
  <button class="btn-sm btn-ghost" onclick="location.hash='';location.reload()" title="back to the whole canvas">fit</button>
  <button class="btn-sm btn-ghost" id="reportHint" title="report a pixel">report</button>
</div>

<!-- daily allowance meter -->
<div class="meter" id="meter" style="display:none">
  <div class="meter-track"><div class="meter-bar" id="meterBar"></div></div>
  <span id="meterText">…</span>
</div>

<!-- the board -->
<canvas id="board"></canvas>

<!-- credits -->
<div class="credits" id="creditsBox">
  <span class="c-label">credits</span>
  <span class="c-balance" id="balance">—</span>
  <span class="c-note" id="ledger">…</span>
  <span class="c-note" id="earnNote"></span>
  <div id="buyRow" style="display:none">
    <div class="packs" id="packRow"></div>
  </div>
</div>

<footer>
  <div id="supportLine"></div>
  <div id="footerNote">one shared canvas. nobody's pixels expire.</div>
  <div class="stats" id="supportStats"></div>
  <div class="keys">click place · right-click erase · E erase mode · wheel zoom · drag pan · F fit · G grid</div>
</footer>

<!-- report dialog -->
<div class="dialog-back" id="reportBack">
  <div class="dialog">
    <h3>report pixel <span id="reportId"></span></h3>
    <p>The pixel stays until the owner decides. Reports they agree with earn you pixels.</p>
    <textarea id="reportReason" maxlength="500" placeholder="spam, abuse, something illegal..."></textarea>
    <div class="actions">
      <button class="btn-ghost" id="reportCancel">cancel</button>
      <button id="reportSubmit">send report</button>
    </div>
  </div>
</div>

<button class="discord-fab" id="discordFab" aria-label="open discord">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
  <span>discord</span>
</button>
<div class="discord-pop" id="discordPop">
  <div class="discord-pop-head">
    <span>volos discord</span>
    <button id="discordClose" aria-label="close">&times;</button>
  </div>
  <iframe src="https://discord.com/widget?id=1548444097033928786&theme=dark" width="350" height="500" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>
</div>

<!-- core first, then the registry, then every feature, then boot.
     ?v=2 busts stale browser/Cloudflare copies of the old message-wall
     files after this rewrite; bump it whenever the frontend changes. -->
<script src="/js/core.js?v=2"></script>
<script src="/js/registry.js?v=2"></script>
<script src="/js/features/canvas.js?v=2"></script>
<script src="/js/features/accounts.js?v=2"></script>
<script src="/js/features/credits.js?v=2"></script>
<script src="/js/features/support_panel.js?v=2"></script>
<script src="/js/features/report.js?v=2"></script>
<script src="/js/features/discord.js?v=2"></script>
<script src="/js/app.js?v=2"></script>
</body>
</html>
